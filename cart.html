<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | فیروز</title>
  <style>
    :root {
      --purple: #b9a9e3;
      --pink: #f6d8ef;
      --white: #f8f8f6;
      --mint: #b7eae1;
      --dark: #3b2f63;
      --main: #6b54b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--white);
      color: var(--dark);
      line-height: 1.9;
    }

    .top {
      background: linear-gradient(160deg, var(--purple), var(--pink) 50%, var(--mint));
      text-align: center;
      padding: 48px 20px 44px;
    }
    .top h1 { font-size: 2rem; margin-bottom: 6px; }
    .top p { margin-bottom: 18px; }

    /* دکمه (مثل بقیه سایت) */
    .btn {
      position: relative;
      overflow: hidden;
      display: inline-block;
      background: var(--main);
      color: #fff;
      border: none;
      padding: 10px 26px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-family: inherit;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(107, 84, 184, 0.3);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .btn:hover { background: var(--dark); transform: translateY(-3px); }
    .btn:active { transform: scale(0.94); }
    .btn.small { width: 34px; height: 34px; padding: 0; font-size: 1.1rem; line-height: 34px; border-radius: 50%; box-shadow: none; }
    .btn.disabled { opacity: 0.45; pointer-events: none; }
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(2.5); opacity: 0; } }

    /* بدنه */
    .cart-box { max-width: 560px; margin: -18px auto 40px; padding: 0 16px; }

    .item {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(107, 84, 184, 0.12);
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .item img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      border-radius: 10px;
      border: 2px solid var(--pink);
      background: #fff;
    }
    .item-info { flex: 1; }
    .item-info h3 { font-size: 0.95rem; line-height: 1.6; }
    .item-info .price { color: var(--main); font-weight: bold; font-size: 0.9rem; }
    .qty { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .qty span { min-width: 22px; text-align: center; font-weight: bold; }
    .remove {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #c0392b;
      cursor: pointer;
      padding: 6px;
    }

    .total {
      background: var(--mint);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 18px;
    }

    /* حالت خالی */
    .empty { text-align: center; background: #fff; border-radius: 18px; padding: 40px 20px; box-shadow: 0 4px 16px rgba(107, 84, 184, 0.12); margin-bottom: 18px; }
    .empty .icon { font-size: 4rem; }
    .empty h2 { margin: 8px 0 4px; font-size: 1.3rem; }
    .empty p { color: #6d6490; margin-bottom: 16px; }

    #checkoutBtn { display: block; width: 100%; padding: 13px; font-size: 1rem; }
  </style>
</head>
<body>

  <header class="top">
    <h1>سبد خرید</h1>
    <p>محصولات انتخاب‌شده شما</p>
    <a class="btn" href="index.html#products">← ادامه خرید</a>
  </header>

  <main class="cart-box">
    <div id="items"></div>

    <!-- حالت خالی -->
    <div class="empty" id="emptyBox" style="display:none;">
      <div class="icon">🛒</div>
      <h2>سبد خرید شما خالی است</h2>
      <p>هنوز محصولی به سبد خرید اضافه نکرده‌اید.</p>
      <a class="btn" href="index.html#products">مشاهده محصولات</a>
    </div>

    <div class="total" id="totalBox" style="display:none;">
      <span>جمع کل</span>
      <span id="totalPrice"></span>
    </div>

    <a class="btn disabled" id="checkoutBtn" href="profile.html">تکمیل مراحل خرید</a>
  </main>

  <script>
    function faNum(n) { return n.toLocaleString('fa-IR'); }
    function loadCart() {
      try { return JSON.parse(localStorage.getItem('firoozCart')) || []; } catch (e) { return []; }
    }
    function saveCart(c) {
      try { localStorage.setItem('firoozCart', JSON.stringify(c)); } catch (e) {}
    }

    var cart = loadCart();
    var list = document.getElementById('items');
    var emptyBox = document.getElementById('emptyBox');
    var totalBox = document.getElementById('totalBox');
    var checkout = document.getElementById('checkoutBtn');

    function render() {
      list.innerHTML = '';

      // اگه سبد خالیه
      if (cart.length === 0) {
        emptyBox.style.display = 'block';
        totalBox.style.display = 'none';
        checkout.classList.add('disabled');
        return;
      }

      emptyBox.style.display = 'none';
      totalBox.style.display = 'flex';
      checkout.classList.remove('disabled');

      var total = 0;
      cart.forEach(function (item, i) {
        total += item.price * item.qty;
        var div = document.createElement('div');
        div.className = 'item';
        div.innerHTML =
          '<img src="' + item.img + '" alt="">' +
          '<div class="item-info">' +
            '<h3>' + item.name + '</h3>' +
            '<div class="price">' + faNum(item.price) + ' تومان</div>' +
            '<div class="qty">' +
              '<button class="btn small" data-act="dec" data-i="' + i + '">−</button>' +
              '<span>' + faNum(item.qty) + '</span>' +
              '<button class="btn small" data-act="inc" data-i="' + i + '">+</button>' +
            '</div>' +
          '</div>' +
          '<button class="remove" data-act="del" data-i="' + i + '" aria-label="حذف">🗑️</button>';
        list.appendChild(div);
      });
      document.getElementById('totalPrice').textContent = faNum(total) + ' تومان';
    }

    // کم، زیاد و حذف
    list.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var i = Number(btn.dataset.i);
      if (btn.dataset.act === 'inc') cart[i].qty++;
      if (btn.dataset.act === 'dec') cart[i].qty--;
      if (btn.dataset.act === 'del' || cart[i].qty <= 0) cart.splice(i, 1);
      saveCart(cart);
      render();
    });

    // افکت موج روی همه دکمه‌ها
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.btn');
      if (!btn) return;
      var rect = btn.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var wave = document.createElement('span');
      wave.className = 'ripple';
      wave.style.width = wave.style.height = size + 'px';
      wave.style.left = (e.clientX - rect.left - size / 2) + 'px';
      wave.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(wave);
      setTimeout(function () { wave.remove(); }, 600);
    });

    render();
  </script>

</body>
</html>
